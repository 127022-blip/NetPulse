name: NetPulse
options:
  bundleIdPrefix: com.netpulse
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    PRODUCT_NAME: NetPulse
    MARKETING_VERSION: "2.0.55"
    CURRENT_PROJECT_VERSION: "255"
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    COMBINE_HIDPI_IMAGES: YES

targets:
  NetPulse:
    type: application
    platform: macOS
    sources:
      - path: NetPulse
        excludes:
          - "**/.DS_Store"
          - "Tests/**"
    settings:
      base:
        INFOPLIST_FILE: NetPulse/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: NetPulse/Resources/NetPulse.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        ENABLE_APP_SANDBOX: NO
        ENABLE_USER_SELECTED_FILES: false
        CODE_SIGN_IDENTITY: "-"
        SWIFT_OBJC_BRIDGING_HEADER: NetPulse/Services/NetPulse-Bridging-Header.h
    dependencies:
      - framework: CoreWLAN.framework
        embed: false
      - framework: CoreLocation.framework
        embed: false
      - framework: SystemConfiguration.framework
        embed: false
      - framework: IOKit.framework
        embed: false
    entitlements:
      path: NetPulse/Resources/NetPulse.entitlements
    postBuildScripts:
      - name: "Rename App with Version"
        script: |
          BUILD_NUM_FILE="${SRCROOT}/build_number.txt"
          if [ -f "$BUILD_NUM_FILE" ]; then
            BUILD_NUM=$(cat "$BUILD_NUM_FILE")
            BUILD_NUM=$((BUILD_NUM + 1))
          else
            BUILD_NUM=1
          fi
          echo "$BUILD_NUM" > "$BUILD_NUM_FILE"

          MARKETING_VERSION=$(xcodebuild -project "${PROJECT_FILE_PATH}" -target NetPulse -configuration Debug -showBuildSettings 2>/dev/null | grep "MARKETING_VERSION" | head -1 | awk '{print $3}')
          if [ -z "$MARKETING_VERSION" ]; then
            MARKETING_VERSION="2.0.55"
          fi
          PRODUCT_NAME="NetPulse"

          DESKTOP_DIR="${HOME}/Desktop"
          mkdir -p "$DESKTOP_DIR"

          SRC_APP="${BUILT_PRODUCTS_DIR}/${PRODUCT_NAME}.app"
          DST_APP="${DESKTOP_DIR}/${PRODUCT_NAME}-${MARKETING_VERSION}-(${BUILD_NUM}).app"

          if [ -d "$SRC_APP" ]; then
            rm -rf "$DST_APP"
            cp -Rp "$SRC_APP" "$DST_APP"
            codesign --force --sign - "$DST_APP"
            sync
            echo "✅ Created: $DST_APP"
          fi
